<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Condition</title>
</head>
<body>

    <h1>Add Condition</h1>

    <form th:action="@{/conditions}" th:object="${condition}" method="post">

        <label>Patient:</label>
        <select name="patientId" required>
            <option value="">Select patient</option>

            <option
                th:each="patient : ${patients}"
                th:value="${patient.id}"
                th:text="${patient.patientId + ' - ' + patient.firstName + ' ' + patient.lastName}">
            </option>
        </select>

        <br>

        <label>Condition Code:</label>
        <input type="text" th:field="*{conditionCode}" required>

        <br>

        <label>Condition Name:</label>
        <input type="text" th:field="*{conditionName}" required>

        <br>

        <label>Status:</label>
        <input type="text" th:field="*{status}" required>

        <br>

        <button type="submit">Add Condition</button>

    </form>

</body>
</html>
